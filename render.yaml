services:
  - type: web
    name: palmira-ui
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: sh start.sh
    healthCheckPath: /health
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
